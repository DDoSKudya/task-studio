[project]
name = "studio-analytics"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = [
    "studio-common",
    "studio-contracts",
    "uvicorn[standard]>=0.32",
    "alembic>=1.14",
    "clickhouse-connect>=0.8",
    "aio-pika>=9.5",
    "redis>=5.2",
]

[tool.uv.sources]
studio-common = { workspace = true }
studio-contracts = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
