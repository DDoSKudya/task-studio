[project]
name = "studio-integrations"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = [
    "studio-common",
    "studio-contracts",
    "studio-integration-sdk",
    "httpx>=0.28",
    "aio-pika>=9.5",
    "redis>=5.2",
    "uvicorn[standard]>=0.32",
    "alembic>=1.14",
    "python-multipart>=0.0.20",
]

[tool.uv.sources]
studio-common = { workspace = true }
studio-contracts = { workspace = true }
studio-integration-sdk = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
