[project]
name = "studio-auth"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "studio-common",
    "studio-contracts",
    "uvicorn[standard]>=0.32",
    "argon2-cffi>=23.1",
    "alembic>=1.14",
    "email-validator>=2.2",
]

[tool.uv.sources]
studio-common = { workspace = true }
studio-contracts = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
