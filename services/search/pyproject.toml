[project]
name = "studio-search"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "studio-common",
    "studio-contracts",
    "httpx>=0.28",
    "meilisearch>=0.34",
    "aio-pika>=9.5",
    "uvicorn[standard]>=0.32",
]

[tool.uv.sources]
studio-common = { workspace = true }
studio-contracts = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
