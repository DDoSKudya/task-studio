[project]
name = "studio-orchestrator"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "studio-common",
    "uvicorn[standard]>=0.32",
]

[tool.uv.sources]
studio-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
