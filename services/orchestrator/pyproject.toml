[project]
name = "studio-orchestrator"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "studio-common",
    "studio-contracts",
    "uvicorn[standard]>=0.32",
    "httpx>=0.28",
    "pyyaml>=6.0",
    "prometheus-client>=0.21",
    "redis>=5.2",
]

[tool.uv.sources]
studio-common = { workspace = true }
studio-contracts = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
