name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --all-packages
      - name: Ruff check
        run: uv run ruff check packages/python-common packages/contracts services scripts
      - name: Ruff format
        run: uv run ruff format --check packages/python-common packages/contracts services scripts
      - name: Mypy
        run: uv run mypy packages/python-common/src
      - name: basedpyright (scoped)
        run: >
          uv run basedpyright
          packages/python-common/src
          packages/contracts/studio_contracts
          || uv run pyright
          packages/python-common/src
          packages/contracts/studio_contracts
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Launcher checks
        run: bash scripts/ci/check-launcher.sh
      - name: Compose config
        run: bash scripts/ci/check-compose.sh
      - name: Tracked modules
        run: bash scripts/ci/check-tracked-modules.sh

  launcher-unix:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Launcher checks
        run: bash scripts/ci/check-launcher.sh
      - name: Bootstrap smoke
        run: bash scripts/ci/smoke-launcher-bootstrap.sh
      - name: Update smoke
        run: bash scripts/ci/smoke-launcher-update.sh

  launcher-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Launcher checks
        shell: powershell
        run: .\scripts\ci\check-launcher.ps1
      - name: Bootstrap smoke
        shell: powershell
        run: .\scripts\ci\smoke-launcher-bootstrap.ps1
      - name: Update smoke
        shell: powershell
        run: .\scripts\ci\smoke-launcher-update.ps1

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --all-packages
      - name: Validate pack schema
        run: uv run python scripts/validate_pack_schema.py
      - name: Validate integration fixtures
        run: uv run python scripts/validate_integration_fixtures.py
      - name: Tracked modules
        run: bash scripts/ci/check-tracked-modules.sh
      - name: Pytest
        run: |
          set -eo pipefail
          shared_path="packages/python-common/src:packages/contracts:packages/integration-sdk"
          PYTHONPATH="$shared_path" uv run pytest -q \
            packages/python-common/tests \
            packages/contracts/tests
          services=(
            auth catalog media studio-api grading sessions tutor cursor-proxy
            integrations analytics lab-runner orchestrator search
          )
          for svc in "${services[@]}"; do
            root="services/${svc}"
            if [ ! -d "${root}/tests" ]; then
              continue
            fi
            echo "==> pytest ${root}/tests"
            PYTHONPATH="${root}:${root}/tests:${shared_path}" uv run pytest -q "${root}/tests"
          done

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install, lint, test
        working-directory: apps/web
        run: |
          npm ci
          npm run lint
          npm run test

  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
