# Optional override: pass host NVIDIA GPU into the Ollama container.
# Usage (with your usual compose files):
#   docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.ollama-gpu.yml --profile full up -d ollama
#
# Requires NVIDIA Container Toolkit on the host. Do not use on CPU-only machines.
# After start: `docker compose exec ollama nvidia-smi` and `ollama ps` — layers should be on GPU.

services:
  ollama:
    gpus: all
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
