x-backend-env: &backend-env
  DATABASE_URL: ${DATABASE_URL}
  REDIS_URL: ${REDIS_URL}
  RABBITMQ_URL: ${RABBITMQ_URL}
  LOG_FORMAT: ${LOG_FORMAT:-json}
  OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}

x-backend: &backend
  restart: unless-stopped
  networks:
    - internal
  environment:
    <<: *backend-env
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
    rabbitmq:
      condition: service_healthy

services:
  postgres:
    image: postgres:16-alpine
    profiles: [full]
    restart: unless-stopped
    networks: [internal]
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ../data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    profiles: [full]
    restart: unless-stopped
    networks: [internal]
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - ../data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management-alpine
    profiles: [full]
    restart: unless-stopped
    networks: [internal]
    environment:
      RABBITMQ_DEFAULT_USER: ${POSTGRES_USER}
      RABBITMQ_DEFAULT_PASS: ${POSTGRES_PASSWORD}
    volumes:
      - ../data/rabbitmq:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5

  traefik:
    image: traefik:v3.4
    profiles: [full]
    restart: unless-stopped
    networks: [edge, internal]
    environment:
      DOCKER_API_VERSION: "1.44"
    command:
      - --configFile=/etc/traefik/traefik.yml
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
    ports:
      - "8080:8080"

  nginx:
    image: nginx:alpine
    profiles: [full]
    restart: unless-stopped
    networks: [edge, internal]
    depends_on:
      web:
        condition: service_healthy
      pack-studio:
        condition: service_healthy
      studio-api:
        condition: service_healthy
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro

  studio-api:
    <<: *backend
    profiles: [full]
    networks: [internal, edge]
    build:
      context: ..
      dockerfile: services/studio-api/Dockerfile
    environment:
      <<: *backend-env
      PORT: "8000"
      AUTH_SERVICE_URL: http://auth:8001
      CATALOG_SERVICE_URL: http://catalog:8002
      MEDIA_SERVICE_URL: http://media:8009
      SESSIONS_SERVICE_URL: http://sessions:8003
      TUTOR_SERVICE_URL: http://tutor:8006
      INTEGRATIONS_SERVICE_URL: http://integrations:8005
      SEARCH_SERVICE_URL: http://search:8007
      ANALYTICS_SERVICE_URL: http://analytics:8008
      ORCHESTRATOR_SERVICE_URL: http://orchestrator:8011
      SECRETS_MASTER_KEY: ${SECRETS_MASTER_KEY}
      LSP_PYRIGHT_HOST: lsp-pyright
      LSP_TYPESCRIPT_HOST: lsp-typescript
      LSP_GOPLS_HOST: lsp-gopls
      LSP_SQLS_HOST: lsp-sqls
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRE_HOURS: ${JWT_EXPIRE_HOURS}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    labels:
      - traefik.enable=true
      - traefik.docker.network=task-studio-edge
      - traefik.http.routers.studio-api.rule=PathPrefix(`/api`)
      - traefik.http.routers.studio-api.entrypoints=web
      - traefik.http.services.studio-api.loadbalancer.server.port=8000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  auth:
    <<: *backend
    profiles: [full]
    build:
      context: ..
      dockerfile: services/auth/Dockerfile
    environment:
      <<: *backend-env
      PORT: "8001"
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRE_HOURS: ${JWT_EXPIRE_HOURS}
      SECRETS_MASTER_KEY: ${SECRETS_MASTER_KEY}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  catalog:
    <<: *backend
    profiles: [full]
    build:
      context: ..
      dockerfile: services/catalog/Dockerfile
    environment:
      <<: *backend-env
      PORT: "8002"
      PACKS_ROOT: /data/packs
      PACK_MAX_UPLOAD_MB: ${PACK_MAX_UPLOAD_MB}
    volumes:
      - ../data/packs:/data/packs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  sessions:
    <<: *backend
    profiles: [full]
    build:
      context: ..
      dockerfile: services/sessions/Dockerfile
    environment:
      <<: *backend-env
      PORT: "8003"
      CATALOG_SERVICE_URL: http://catalog:8002
      GRADING_SERVICE_URL: http://grading:8004
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8003/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  grading:
    <<: *backend
    profiles: [full]
    build:
      context: ..
      dockerfile: services/grading/Dockerfile
    environment:
      <<: *backend-env
      PORT: "8004"
      PISTON_URL: http://piston:2000
      CATALOG_SERVICE_URL: http://catalog:8002
      SESSIONS_SERVICE_URL: http://sessions:8003
      GRADING_JOBS_QUEUE: grading.jobs
      LAB_JOBS_QUEUE: lab.jobs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      piston:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8004/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  piston:
    image: ghcr.io/engineer-man/piston
    profiles: [full]
    restart: unless-stopped
    networks: [internal]
    privileged: true
    tmpfs:
      - /tmp:exec
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:2000/api/v2/runtimes').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  integrations:
    <<: *backend
    profiles: [full]
    build:
      context: ..
      dockerfile: services/integrations/Dockerfile
    environment:
      <<: *backend-env
      PORT: "8005"
      INTEGRATION_MODULES_ROOT: /app/integration_modules
      PACKS_ROOT: /data/packs
      CATALOG_SERVICE_URL: http://catalog:8002
    volumes:
      - ../integration_modules:/app/integration_modules:ro
      - ../data/packs:/data/packs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8005/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  meilisearch:
    image: getmeili/meilisearch:v1.12
    profiles: [full]
    restart: unless-stopped
    networks: [internal]
    environment:
      MEILI_ENV: development
      MEILI_NO_ANALYTICS: "true"
    volumes:
      - ../data/meilisearch:/meili_data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7700/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  clickhouse:
    image: clickhouse/clickhouse-server:24.8-alpine
    profiles: [full]
    restart: unless-stopped
    networks: [internal]
    environment:
      CLICKHOUSE_DB: analytics
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    volumes:
      - ../data/clickhouse:/var/lib/clickhouse
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8123/ping"]
      interval: 15s
      timeout: 5s
      retries: 5

  tutor:
    <<: *backend
    profiles: [full]
    build:
      context: ..
      dockerfile: services/tutor/Dockerfile
    environment:
      <<: *backend-env
      PORT: "8006"
      AUTH_SERVICE_URL: http://auth:8001
      SESSIONS_SERVICE_URL: http://sessions:8003
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2}
      TUTOR_RATE_LIMIT_PER_MINUTE: ${TUTOR_RATE_LIMIT_PER_MINUTE:-30}
      SECRETS_MASTER_KEY: ${SECRETS_MASTER_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      ollama:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8006/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  ollama:
    image: ollama/ollama:latest
    profiles: [full]
    restart: unless-stopped
    networks: [internal]
    volumes:
      - ../data/ollama:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  search:
    <<: *backend
    profiles: [full]
    build:
      context: ..
      dockerfile: services/search/Dockerfile
    environment:
      <<: *backend-env
      PORT: "8007"
      MEILISEARCH_URL: http://meilisearch:7700
      CATALOG_SERVICE_URL: http://catalog:8002
      OLLAMA_URL: http://ollama:11434
    depends_on:
      meilisearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8007/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  analytics:
    <<: *backend
    profiles: [full]
    build:
      context: ..
      dockerfile: services/analytics/Dockerfile
    environment:
      <<: *backend-env
      PORT: "8008"
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: "8123"
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ""
      CLICKHOUSE_DATABASE: analytics
      ANALYTICS_EVENTS_QUEUE: analytics.events
    depends_on:
      clickhouse:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8008/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  media:
    <<: *backend
    profiles: [full]
    build:
      context: ..
      dockerfile: services/media/Dockerfile
    environment:
      <<: *backend-env
      PORT: "8009"
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: studio
      MINIO_SECURE: "false"
    depends_on:
      minio:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8009/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  lab-runner:
    <<: *backend
    profiles: [full]
    build:
      context: ..
      dockerfile: services/lab-runner/Dockerfile
    environment:
      <<: *backend-env
      PORT: "8010"
      GRADING_SERVICE_URL: http://grading:8004
      LAB_JOBS_QUEUE: lab.jobs
      LAB_RUNNER_DRY_RUN: ${LAB_RUNNER_DRY_RUN:-true}
      LAB_DEFAULT_TIMEOUT_SECONDS: ${LAB_DEFAULT_TIMEOUT_SECONDS:-120}
    volumes:
      - ../data/packs:/data/packs:ro
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      grading:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8010/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  orchestrator:
    <<: *backend
    profiles: [full]
    build:
      context: ..
      dockerfile: services/orchestrator/Dockerfile
    environment:
      <<: *backend-env
      PORT: "8011"
      ORCHESTRATOR_MODE: ${ORCHESTRATOR_MODE}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8011/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  lsp-pyright:
    build:
      context: ..
      dockerfile: deploy/lsp/pyright/Dockerfile
    profiles: [editor]
    restart: unless-stopped
    networks: [internal]

  lsp-typescript:
    build:
      context: ..
      dockerfile: deploy/lsp/typescript/Dockerfile
    profiles: [editor]
    restart: unless-stopped
    networks: [internal]

  lsp-gopls:
    build:
      context: ..
      dockerfile: deploy/lsp/gopls/Dockerfile
    profiles: [editor]
    restart: unless-stopped
    networks: [internal]

  lsp-sqls:
    build:
      context: ..
      dockerfile: deploy/lsp/sqls/Dockerfile
    profiles: [editor]
    restart: unless-stopped
    networks: [internal]

  web:
    profiles: [full]
    build:
      context: ../apps/web
      dockerfile: Dockerfile
    restart: unless-stopped
    networks: [edge, internal]
    labels:
      - traefik.enable=true
      - traefik.docker.network=task-studio-edge
      - traefik.http.routers.web.rule=PathPrefix(`/`)
      - traefik.http.routers.web.entrypoints=web
      - traefik.http.routers.web.priority=1
      - traefik.http.services.web.loadbalancer.server.port=3000
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  pack-studio:
    profiles: [full]
    build:
      context: ../apps/pack-studio
      dockerfile: Dockerfile
    restart: unless-stopped
    networks: [edge, internal]
    environment:
      NUXT_PUBLIC_API_BASE: /api
      NUXT_APP_BASE_URL: /pack-studio/
    labels:
      - traefik.enable=true
      - traefik.docker.network=task-studio-edge
      - traefik.http.routers.pack-studio.rule=PathPrefix(`/pack-studio`)
      - traefik.http.routers.pack-studio.entrypoints=web
      - traefik.http.routers.pack-studio.priority=2
      - traefik.http.services.pack-studio.loadbalancer.server.port=3000
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/pack-studio/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    profiles: [full]
    restart: unless-stopped
    networks: [internal]
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - ../data/minio:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 5

  prometheus:
    image: prom/prometheus:v3.2.1
    profiles: [full]
    restart: unless-stopped
    networks: [internal]
    user: "65534:65534"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:11.5.2
    profiles: [full]
    restart: unless-stopped
    networks: [internal]
    user: "472:472"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3001:3000"
    depends_on:
      - prometheus

networks:
  edge:
    name: task-studio-edge
  internal:
    name: task-studio-internal

volumes:
  prometheus_data:
  grafana_data:
