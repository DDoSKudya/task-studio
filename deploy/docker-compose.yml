x-backend-env: &backend-env
  DATABASE_URL: ${DATABASE_URL}
  REDIS_URL: ${REDIS_URL}
  RABBITMQ_URL: ${RABBITMQ_URL}
  LOG_FORMAT: ${LOG_FORMAT:-json}
  OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}

x-backend: &backend
  restart: unless-stopped
  networks:
    - internal
  environment:
    <<: *backend-env
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
    rabbitmq:
      condition: service_healthy

services:
  postgres:
    image: postgres:16-alpine
    profiles: [full]
    restart: unless-stopped
    networks: [internal]
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ../data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    profiles: [full]
    restart: unless-stopped
    networks: [internal]
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - ../data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management-alpine
    profiles: [full]
    restart: unless-stopped
    networks: [internal]
    environment:
      RABBITMQ_DEFAULT_USER: ${POSTGRES_USER}
      RABBITMQ_DEFAULT_PASS: ${POSTGRES_PASSWORD}
    volumes:
      - ../data/rabbitmq:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5

  traefik:
    image: traefik:v3.4
    profiles: [full]
    restart: unless-stopped
    networks: [edge, internal]
    environment:
      DOCKER_API_VERSION: "1.44"
    command:
      - --configFile=/etc/traefik/traefik.yml
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
    ports:
      - "8080:8080"

  nginx:
    image: nginx:alpine
    profiles: [full]
    restart: unless-stopped
    networks: [edge, internal]
    depends_on:
      web:
        condition: service_healthy
      pack-studio:
        condition: service_healthy
      studio-api:
        condition: service_healthy
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/proxy.conf:/etc/nginx/proxy.conf:ro

  studio-api:
    <<: *backend
    profiles: [full]
    networks: [internal, edge]
    build:
      context: ..
      dockerfile: services/studio-api/Dockerfile
    environment:
      <<: *backend-env
      PORT: "8000"
      AUTH_SERVICE_URL: http://auth:8001
      CATALOG_SERVICE_URL: http://catalog:8002
      MEDIA_SERVICE_URL: http://media:8009
      SESSIONS_SERVICE_URL: http://sessions:8003
      TUTOR_SERVICE_URL: http://tutor:8006
      INTEGRATIONS_SERVICE_URL: http://integrations:8005
      SEARCH_SERVICE_URL: http://search:8007
      ANALYTICS_SERVICE_URL: http://analytics:8008
      ORCHESTRATOR_SERVICE_URL: http://orchestrator:8011
      SECRETS_MASTER_KEY: ${SECRETS_MASTER_KEY}
      LSP_PYRIGHT_HOST: lsp-pyright
      LSP_TYPESCRIPT_HOST: lsp-typescript
      LSP_GOPLS_HOST: lsp-gopls
      LSP_SQLS_HOST: lsp-sqls
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRE_HOURS: ${JWT_EXPIRE_HOURS}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    labels:
      - traefik.enable=true
      - traefik.docker.network=task-studio-edge
      - traefik.http.routers.studio-api.rule=PathPrefix(`/api`)
      - traefik.http.routers.studio-api.entrypoints=web
      - traefik.http.services.studio-api.loadbalancer.server.port=8000
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

  auth:
    <<: *backend
    profiles: [full]
    build:
      context: ..
      dockerfile: services/auth/Dockerfile
    environment:
      <<: *backend-env
      PORT: "8001"
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRE_HOURS: ${JWT_EXPIRE_HOURS}
      SECRETS_MASTER_KEY: ${SECRETS_MASTER_KEY}
      ORCHESTRATOR_SYSTEM_TOKEN: ${ORCHESTRATOR_SYSTEM_TOKEN:-}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

  catalog:
    <<: *backend
    profiles: [full]
    build:
      context: ..
      dockerfile: services/catalog/Dockerfile
    environment:
      <<: *backend-env
      PORT: "8002"
      PACKS_ROOT: /data/packs
      PACK_MAX_UPLOAD_MB: ${PACK_MAX_UPLOAD_MB}
      MEDIA_SERVICE_URL: http://media:8009
    volumes:
      - ../data/packs:/data/packs
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8002/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

  sessions:
    <<: *backend
    profiles: [full]
    build:
      context: ..
      dockerfile: services/sessions/Dockerfile
    environment:
      <<: *backend-env
      PORT: "8003"
      CATALOG_SERVICE_URL: http://catalog:8002
      GRADING_SERVICE_URL: http://grading:8004
      ANALYTICS_SERVICE_URL: http://analytics:8008
      ANALYTICS_EVENTS_QUEUE: ${ANALYTICS_EVENTS_QUEUE:-analytics.events}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8003/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

  grading:
    <<: *backend
    profiles: [full]
    build:
      context: ..
      dockerfile: services/grading/Dockerfile
    environment:
      <<: *backend-env
      PORT: "8004"
      PISTON_URL: http://piston:2000
      CATALOG_SERVICE_URL: http://catalog:8002
      SESSIONS_SERVICE_URL: http://sessions:8003
      AUTH_SERVICE_URL: http://auth:8001
      TUTOR_SERVICE_URL: http://tutor:8006
      MEDIA_SERVICE_URL: http://media:8009
      PACKS_ROOT: /data/packs
      SECRETS_MASTER_KEY: ${SECRETS_MASTER_KEY}
      LLM_GRADE_ENABLED: ${LLM_GRADE_ENABLED:-true}
      LLM_GRADE_MIN_CONFIDENCE: ${LLM_GRADE_MIN_CONFIDENCE:-0.65}
      GRADING_JOBS_QUEUE: grading.jobs
      LAB_JOBS_QUEUE: lab.jobs
    volumes:
      - ../data/packs:/data/packs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      piston:
        condition: service_started
      tutor:
        condition: service_healthy
      media:
        condition: service_healthy
      catalog:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8004/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

  piston:
    image: ghcr.io/engineer-man/piston
    profiles: [full]
    restart: unless-stopped
    networks: [internal]
    privileged: true
    # Match grading PISTON_TIMEOUT_SECONDS (default 10s); image defaults are 3s.
    environment:
      PISTON_RUN_TIMEOUT: "15000"
      PISTON_RUN_CPU_TIME: "15000"
      PISTON_COMPILE_TIMEOUT: "15000"
      PISTON_COMPILE_CPU_TIME: "15000"
    tmpfs:
      - /tmp:exec
    volumes:
      - ../data/piston/packages:/piston/packages
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://127.0.0.1:2000/api/v2/runtimes', (r) => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  integrations:
    <<: *backend
    profiles: [full]
    build:
      context: ..
      dockerfile: services/integrations/Dockerfile
    environment:
      <<: *backend-env
      PORT: "8005"
      INTEGRATION_MODULES_ROOT: /app/integration_modules
      PACKS_ROOT: /data/packs
      CATALOG_SERVICE_URL: http://catalog:8002
      AUTH_SERVICE_URL: http://auth:8001
      SECRETS_MASTER_KEY: ${SECRETS_MASTER_KEY}
      STEPIK_CLIENT_ID: ${STEPIK_CLIENT_ID:-}
      STEPIK_CLIENT_SECRET: ${STEPIK_CLIENT_SECRET:-}
    volumes:
      - ../integration_modules:/app/integration_modules:ro
      - ../data/packs:/data/packs
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8005/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

  meilisearch:
    image: getmeili/meilisearch:v1.12
    profiles: [full]
    restart: unless-stopped
    networks: [internal]
    environment:
      MEILI_ENV: development
      MEILI_NO_ANALYTICS: "true"
    volumes:
      - ../data/meilisearch:/meili_data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7700/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  clickhouse:
    image: clickhouse/clickhouse-server:24.8-alpine
    profiles: [full]
    restart: unless-stopped
    networks: [internal]
    environment:
      CLICKHOUSE_DB: analytics
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    volumes:
      - ../data/clickhouse:/var/lib/clickhouse
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8123/ping"]
      interval: 15s
      timeout: 5s
      retries: 5

  tutor:
    <<: *backend
    profiles: [full]
    build:
      context: ..
      dockerfile: services/tutor/Dockerfile
    environment:
      <<: *backend-env
      PORT: "8006"
      AUTH_SERVICE_URL: http://auth:8001
      SESSIONS_SERVICE_URL: http://sessions:8003
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2}
      TUTOR_RATE_LIMIT_PER_MINUTE: ${TUTOR_RATE_LIMIT_PER_MINUTE:-30}
      SECRETS_MASTER_KEY: ${SECRETS_MASTER_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      ollama:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8006/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

  ollama:
    image: ollama/ollama:latest
    profiles: [full]
    restart: unless-stopped
    networks: [internal]
    environment:
      # Keep one model warm between tutor draft+polish; avoid thrashing on CPU.
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-30m}
      OLLAMA_NUM_PARALLEL: ${OLLAMA_NUM_PARALLEL:-1}
    volumes:
      - ../data/ollama:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  cursor-proxy:
    <<: *backend
    profiles: [full]
    build:
      context: ..
      dockerfile: services/cursor-proxy/Dockerfile
    environment:
      <<: *backend-env
      PORT: "8015"
      CURSOR_API_BASE: ${CURSOR_API_BASE:-https://api.cursor.com}
      CURSOR_PROXY_TIMEOUT_SECONDS: ${CURSOR_PROXY_TIMEOUT_SECONDS:-180}
      CURSOR_PROXY_CLEANUP_AGENTS: ${CURSOR_PROXY_CLEANUP_AGENTS:-true}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8015/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

  search:
    <<: *backend
    profiles: [full]
    build:
      context: ..
      dockerfile: services/search/Dockerfile
    environment:
      <<: *backend-env
      PORT: "8007"
      MEILISEARCH_URL: ${MEILISEARCH_URL:-http://meilisearch:7700}
      MEILISEARCH_KEY: ${MEILISEARCH_KEY:-}
      CATALOG_SERVICE_URL: http://catalog:8002
      OLLAMA_URL: http://ollama:11434
    depends_on:
      meilisearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8007/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

  analytics:
    <<: *backend
    profiles: [full]
    build:
      context: ..
      dockerfile: services/analytics/Dockerfile
    environment:
      <<: *backend-env
      PORT: "8008"
      CLICKHOUSE_HOST: ${CLICKHOUSE_HOST:-clickhouse}
      CLICKHOUSE_PORT: ${CLICKHOUSE_PORT:-8123}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-}
      CLICKHOUSE_DATABASE: ${CLICKHOUSE_DATABASE:-analytics}
      ANALYTICS_EVENTS_QUEUE: ${ANALYTICS_EVENTS_QUEUE:-analytics.events}
    depends_on:
      clickhouse:
        condition: service_started
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8008/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

  media:
    <<: *backend
    profiles: [full]
    build:
      context: ..
      dockerfile: services/media/Dockerfile
    environment:
      <<: *backend-env
      PORT: "8009"
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: studio
      MINIO_SECURE: "false"
    depends_on:
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8009/health')"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  lab-runner:
    <<: *backend
    profiles: [full]
    build:
      context: ..
      dockerfile: services/lab-runner/Dockerfile
    environment:
      <<: *backend-env
      PORT: "8010"
      GRADING_SERVICE_URL: http://grading:8004
      LAB_JOBS_QUEUE: lab.jobs
      LAB_RUNNER_DRY_RUN: ${LAB_RUNNER_DRY_RUN:-true}
      LAB_DEFAULT_TIMEOUT_SECONDS: ${LAB_DEFAULT_TIMEOUT_SECONDS:-120}
    volumes:
      - ../data/packs:/data/packs:ro
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      grading:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8010/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

  orchestrator:
    profiles: [full]
    build:
      context: ..
      dockerfile: services/orchestrator/Dockerfile
    restart: unless-stopped
    networks: [internal]
    group_add:
      - "${DOCKER_GID:-988}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./orchestrator/policies.yaml:/etc/task-studio/policies.yaml:ro
    environment:
      PORT: "8011"
      ORCHESTRATOR_MODE: ${ORCHESTRATOR_MODE:-balancing}
      ORCHESTRATOR_POLICIES_PATH: /etc/task-studio/policies.yaml
      ORCHESTRATOR_SYSTEM_TOKEN: ${ORCHESTRATOR_SYSTEM_TOKEN:-}
      COMPOSE_PROJECT_NAME: ${COMPOSE_PROJECT_NAME:-task-studio}
      PROMETHEUS_URL: http://prometheus:9090
      NODE_EXPORTER_URL: http://node-exporter:9100
      PYROSCOPE_URL: http://pyroscope:4040
      AUTH_SERVICE_URL: http://auth:8001
      REDIS_URL: ${REDIS_URL}
      TUTOR_DEFAULT_PROVIDER_URL: ${TUTOR_DEFAULT_PROVIDER_URL:-}
      LOG_FORMAT: ${LOG_FORMAT:-json}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    depends_on:
      redis:
        condition: service_healthy
      prometheus:
        condition: service_started
      auth:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8011/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

  node-exporter:
    image: prom/node-exporter:v1.9.0
    profiles: [full]
    restart: unless-stopped
    networks: [internal]
    command:
      - --path.rootfs=/host
    volumes:
      - /:/host:ro,rslave
    pid: host

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.51.0
    profiles: [full]
    restart: unless-stopped
    networks: [internal]
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro

  pyroscope:
    image: grafana/pyroscope:1.12.0
    profiles: [full]
    restart: unless-stopped
    networks: [internal]
    ports:
      - "4040:4040"

  lsp-pyright:
    build:
      context: ..
      dockerfile: deploy/lsp/pyright/Dockerfile
    profiles: [editor]
    restart: unless-stopped
    networks: [internal]

  lsp-typescript:
    build:
      context: ..
      dockerfile: deploy/lsp/typescript/Dockerfile
    profiles: [editor]
    restart: unless-stopped
    networks: [internal]

  lsp-gopls:
    build:
      context: ..
      dockerfile: deploy/lsp/gopls/Dockerfile
    profiles: [editor]
    restart: unless-stopped
    networks: [internal]

  lsp-sqls:
    build:
      context: ..
      dockerfile: deploy/lsp/sqls/Dockerfile
    profiles: [editor]
    restart: unless-stopped
    networks: [internal]

  web:
    profiles: [full]
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    networks: [edge, internal]
    environment:
      API_BASE_INTERNAL: http://studio-api:8000
      NUXT_PUBLIC_API_BASE: /api
    labels:
      - traefik.enable=true
      - traefik.docker.network=task-studio-edge
      - traefik.http.routers.web.rule=PathPrefix(`/`)
      - traefik.http.routers.web.entrypoints=web
      - traefik.http.routers.web.priority=1
      - traefik.http.services.web.loadbalancer.server.port=3000
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  pack-studio:
    profiles: [full]
    build:
      context: ../apps/pack-studio
      dockerfile: Dockerfile
    restart: unless-stopped
    networks: [edge, internal]
    environment:
      NUXT_PUBLIC_API_BASE: /api
      NUXT_APP_BASE_URL: /pack-studio/
    labels:
      - traefik.enable=true
      - traefik.docker.network=task-studio-edge
      - traefik.http.routers.pack-studio.rule=PathPrefix(`/pack-studio`)
      - traefik.http.routers.pack-studio.entrypoints=web
      - traefik.http.routers.pack-studio.priority=2
      - traefik.http.services.pack-studio.loadbalancer.server.port=3000
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/pack-studio/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    profiles: [full]
    restart: unless-stopped
    networks: [internal]
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - ../data/minio:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 5

  prometheus:
    image: prom/prometheus:v3.2.1
    profiles: [full]
    restart: unless-stopped
    networks: [internal]
    user: "65534:65534"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:11.5.2
    profiles: [full]
    restart: unless-stopped
    networks: [internal]
    user: "472:472"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3001:3000"
    depends_on:
      - prometheus

networks:
  edge:
    name: task-studio-edge
  internal:
    name: task-studio-internal

volumes:
  prometheus_data:
  grafana_data:
