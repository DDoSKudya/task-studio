events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    upstream web {
        server web:3000;
    }

    upstream pack_studio {
        server pack-studio:3000;
    }

    upstream studio_api {
        server studio-api:8000;
    }

    server {
        listen 80;
        server_name _;
        client_max_body_size 500m;

        add_header X-Task-Studio "1" always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob: data:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:" always;

        location /api/ {
            include /etc/nginx/proxy.conf;
            proxy_hide_header Cache-Control;
            # location-level add_header затирает server-level — дублируем маркер UI.
            add_header X-Task-Studio "1" always;
            add_header Cache-Control "no-store" always;
            proxy_pass http://studio_api/;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }

        location /_nuxt/ {
            include /etc/nginx/proxy.conf;
            proxy_hide_header Cache-Control;
            add_header X-Task-Studio "1" always;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            proxy_pass http://web;
        }

        location /pack-studio/_nuxt/ {
            include /etc/nginx/proxy.conf;
            proxy_hide_header Cache-Control;
            add_header X-Task-Studio "1" always;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            proxy_pass http://pack_studio;
        }

        location /pack-studio/ {
            include /etc/nginx/proxy.conf;
            proxy_hide_header Cache-Control;
            add_header X-Task-Studio "1" always;
            add_header Cache-Control "no-cache" always;
            proxy_pass http://pack_studio;
        }

        location / {
            include /etc/nginx/proxy.conf;
            proxy_hide_header Cache-Control;
            add_header X-Task-Studio "1" always;
            add_header Cache-Control "no-cache" always;
            proxy_pass http://web;
        }
    }
}
