events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    resolver 127.0.0.11 valid=10s ipv6=off;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    server {
        listen 80;
        server_name _;
        client_max_body_size 500m;

        add_header X-Task-Studio "1" always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob: data:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:" always;

        location /api/ {
            include /etc/nginx/proxy.conf;
            proxy_hide_header Cache-Control;
            add_header X-Task-Studio "1" always;
            add_header Cache-Control "no-store" always;
            set $studio_api_host studio-api:8000;
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass http://$studio_api_host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }

        location /_nuxt/ {
            include /etc/nginx/proxy.conf;
            proxy_hide_header Cache-Control;
            add_header X-Task-Studio "1" always;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            set $web_host web:3000;
            proxy_pass http://$web_host;
        }

        location /pack-studio/_nuxt/ {
            include /etc/nginx/proxy.conf;
            proxy_hide_header Cache-Control;
            add_header X-Task-Studio "1" always;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            set $pack_studio_host pack-studio:3000;
            proxy_pass http://$pack_studio_host;
        }

        location /pack-studio/ {
            include /etc/nginx/proxy.conf;
            proxy_hide_header Cache-Control;
            add_header X-Task-Studio "1" always;
            add_header Cache-Control "no-cache" always;
            set $pack_studio_host pack-studio:3000;
            proxy_pass http://$pack_studio_host;
        }

        location / {
            include /etc/nginx/proxy.conf;
            proxy_hide_header Cache-Control;
            add_header X-Task-Studio "1" always;
            add_header Cache-Control "no-cache" always;
            set $web_host web:3000;
            proxy_pass http://$web_host;
        }
    }
}
