apiVersion: v1
kind: Service
metadata:
  name: {{ include "task-studio.fullname" . }}-studio-api
  labels:
    {{- include "task-studio.labels" . | nindent 4 }}
    app.kubernetes.io/component: studio-api
spec:
  selector:
    {{- include "task-studio.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: studio-api
  ports:
    - name: http
      port: {{ .Values.studioApi.port }}
      targetPort: http
