{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "task-studio.fullname" . }}
  labels:
    {{- include "task-studio.labels" . | nindent 4 }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: {{ include "task-studio.fullname" . }}-studio-api
                port:
                  number: {{ .Values.studioApi.port }}
{{- end }}
