[project]
name = "task-studio"
version = "1.0.0"
description = "Task Studio monorepo"
license = "AGPL-3.0-or-later"
requires-python = ">=3.12"
dependencies = []

[tool.uv.workspace]
members = ["packages/python-common", "packages/contracts", "packages/integration-sdk", "services/*"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.28",
    "ruff>=0.8",
    "mypy>=1.14",
    "pyright>=1.1.400",
    "jsonschema>=4.23",
    "studio-common",
    "studio-contracts",
    "minio>=7.2",
    "python-multipart>=0.0.20",
    "studio-integration-sdk",
    "meilisearch>=0.34",
    "redis>=5.2",
    "clickhouse-connect>=0.8",
    "alembic>=1.14",
    "pre-commit>=4.0",
]

[tool.uv.sources]
studio-common = { workspace = true }
studio-contracts = { workspace = true }
studio-integration-sdk = { workspace = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "--import-mode=importlib"
testpaths = [
    "packages/python-common/tests",
    "packages/contracts/tests",
    "services/auth/tests",
    "services/catalog/tests",
    "services/media/tests",
    "services/studio-api/tests",
    "services/grading/tests",
    "services/sessions/tests",
    "services/tutor/tests",
    "services/cursor-proxy/tests",
    "services/integrations/tests",
    "services/analytics/tests",
    "services/lab-runner/tests",
    "services/orchestrator/tests",
    "services/search/tests",
]
pythonpath = [
    "packages/python-common/src",
    "packages/contracts",
    "packages/integration-sdk",
]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["studio_common"]

[tool.pyright]
include = ["packages", "services"]
exclude = ["**/__pycache__", "**/.venv", "**/node_modules"]
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
typeCheckingMode = "standard"

[[tool.pyright.executionEnvironments]]
root = "services/auth"
extraPaths = ["../../packages/python-common/src"]

[[tool.pyright.executionEnvironments]]
root = "services/catalog"
extraPaths = [
    "../../packages/python-common/src",
    "../../packages/contracts",
]

[[tool.pyright.executionEnvironments]]
root = "services/media"
extraPaths = ["../../packages/python-common/src"]

[[tool.pyright.executionEnvironments]]
root = "services/studio-api"
extraPaths = [
    "../../packages/python-common/src",
    "../../packages/contracts",
]

[[tool.pyright.executionEnvironments]]
root = "services/sessions"
extraPaths = [
    "../../packages/python-common/src",
    "../../packages/contracts",
]

[[tool.pyright.executionEnvironments]]
root = "services/grading"
extraPaths = [
    "../../packages/python-common/src",
    "../../packages/contracts",
]

[[tool.pyright.executionEnvironments]]
root = "services/tutor"
extraPaths = [
    "../../packages/python-common/src",
    "../../packages/contracts",
]

[[tool.pyright.executionEnvironments]]
root = "services/tutor/tests"
extraPaths = [
    "packages/python-common/src",
    "packages/contracts",
    "services/tutor",
    "services/tutor/tests",
]

[[tool.pyright.executionEnvironments]]
root = "services/integrations"
extraPaths = [
    "packages/python-common/src",
    "packages/contracts",
    "packages/integration-sdk",
]

[[tool.pyright.executionEnvironments]]
root = "services/integrations/tests"
extraPaths = [
    "packages/python-common/src",
    "packages/contracts",
    "packages/integration-sdk",
    "services/integrations",
    "services/integrations/tests",
]

[[tool.pyright.executionEnvironments]]
root = "services/search"
extraPaths = [
    "packages/python-common/src",
    "packages/contracts",
]

[[tool.pyright.executionEnvironments]]
root = "services/analytics"
extraPaths = [
    "packages/python-common/src",
    "packages/contracts",
]

[[tool.pyright.executionEnvironments]]
root = "services/analytics/tests"
extraPaths = [
    "packages/python-common/src",
    "packages/contracts",
    "services/analytics",
    "services/analytics/tests",
]

[[tool.pyright.executionEnvironments]]
root = "services/orchestrator"
extraPaths = [
    "../../packages/python-common/src",
    "../../packages/contracts",
]

[[tool.pyright.executionEnvironments]]
root = "services/orchestrator/tests"
extraPaths = [
    "../../../packages/python-common/src",
    "../../../packages/contracts",
    "..",
    ".",
]

[[tool.pyright.executionEnvironments]]
root = "services/lab-runner"
extraPaths = [
    "../../packages/python-common/src",
    "../../packages/contracts",
]

[[tool.pyright.executionEnvironments]]
root = "packages/integration-sdk"
extraPaths = ["../contracts"]

[[tool.pyright.executionEnvironments]]
root = "packages/python-common/src"

[[tool.pyright.executionEnvironments]]
root = "packages/contracts"
