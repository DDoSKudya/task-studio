[project]
name = "task-studio"
version = "0.1.0"
description = "Task Studio monorepo"
requires-python = ">=3.12"
dependencies = []

[tool.uv.workspace]
members = ["packages/*", "services/*"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.28",
    "ruff>=0.8",
    "mypy>=1.14",
    "jsonschema>=4.23",
    "studio-common",
]

[tool.uv.sources]
studio-common = { workspace = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "--import-mode=importlib"
testpaths = ["packages/python-common/tests", "packages/contracts/tests"]
pythonpath = ["packages/python-common/src", "packages/contracts"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["studio_common"]
