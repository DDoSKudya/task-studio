[project]
name = "studio-contracts"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "jsonschema>=4.23",
    "pydantic>=2.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["studio_contracts"]
include = ["pack-schema-v1.json"]
