[project]
name = "studio-integration-sdk"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "studio-contracts",
]

[tool.uv.sources]
studio-contracts = { workspace = true }

[build-system]
requires = ["hatchling"]
